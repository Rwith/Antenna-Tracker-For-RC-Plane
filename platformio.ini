; PlatformIO project configuration
; Antenna Tracker for RC Planes – ESP32-S3 + QMC5883L compass + ELRS CRSF telemetry

[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; ESP32-S3 native USB serial (use the UART port on the DevKit for flashing)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    madhephaestus/ESP32Servo @ ^0.11.0
