; PlatformIO project configuration
; Antenna Tracker for RC Planes – ESP32-S3 + QMC5883L compass + ELRS CRSF telemetry

[env:esp32-s3]
platform  = espressif32@^6.3.2   ; >=6.x required for ESP32-S3 support
board     = esp32-s3-devkitc-1
board_build.mcu = esp32s3         ; explicit – prevents esptool picking wrong chip
framework = arduino

monitor_speed = 115200
monitor_raw   = yes     ; suppresses Windows ClearCommError on native USB CDC

; CDC_ON_BOOT=1 routes Serial to the native USB port (right connector on DevKit).
; Use the same cable/port for both flashing and the serial monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    madhephaestus/ESP32Servo @ ^0.11.0
