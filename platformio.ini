; PlatformIO project configuration
; Antenna Tracker for RC Planes – ESP32-S3 + QMC5883L compass + ELRS CRSF telemetry

[env:esp32-s3]
platform  = espressif32@^6.3.2   ; >=6.x required for ESP32-S3 support
board     = esp32-s3-devkitc-1
board_build.mcu = esp32s3         ; explicit – prevents esptool picking wrong chip
framework = arduino

monitor_speed = 115200

; Serial (USB monitor) → UART0 → left USB-UART port on the DevKit.
; CDC_ON_BOOT=0 keeps Serial on UART0 (left port).
; CDC_ON_BOOT=1 would redirect it to native USB (right port) – do not use.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    madhephaestus/ESP32Servo @ ^0.11.0
